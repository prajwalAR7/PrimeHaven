spring.application.name=api-gateway
server.port=8080

# ==============================================================================
# Eureka Service Discovery & Registry Configuration
# ==============================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==============================================================================
# Spring Cloud Gateway Dynamic Routes with Client-Side Load Balancing (lb://)
# ==============================================================================
# Route 1: Auth Service (Port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: Property Service (Port 8082)
spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=lb://PROPERTY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/properties/**

# Route 3: Visit Service (Port 8083)
spring.cloud.gateway.routes[2].id=visit-service
spring.cloud.gateway.routes[2].uri=lb://VISIT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/visits/**

# Route 4: Inquiry Service (Port 8084)
spring.cloud.gateway.routes[3].id=inquiry-service
spring.cloud.gateway.routes[3].uri=lb://INQUIRY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inquiries/**

# ==============================================================================
# JWT Security Configuration (DEVELOPMENT-ONLY DEMO SECRET)
# WARNING: This hardcoded HMAC-SHA256 secret is for local academic demonstration only.
# In production, replace with an environment variable:
# e.g., export JWT_SECRET=$(openssl rand -base64 32)
# and reference as: jwt.secret=${JWT_SECRET}
# ==============================================================================
jwt.secret=PrimeHavenDevSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!

# Actuator Health
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
