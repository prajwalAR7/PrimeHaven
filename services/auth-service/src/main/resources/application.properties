spring.application.name=auth-service
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/primehaven_auth_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=sunny@2617

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=auth-service:8081

# JWT Security Configuration
jwt.secret=PrimeHavenDevSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!
jwt.expiration-ms=86400000

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always