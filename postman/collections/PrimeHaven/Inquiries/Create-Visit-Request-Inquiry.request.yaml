$kind: http-request
name: 'Create Visit-Request Inquiry'
order: 2000
method: POST
url: '{{gatewayUrl}}/api/inquiries'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwt}}'
body:
  type: json
  content: |-
    {
      "propertyId": {{propertyId}},
      "buyerUsername": "buyer_david",
      "inquiryType": "VISIT_REQUEST",
      "message": "I want to inspect this villa.",
      "requestVisit": true,
      "visitDate": "2026-10-05",
      "timeSlot": "10:00 AM - 11:00 AM",
      "visitNotes": "Please cover parking details."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // API TEST 15 — Create inquiry that schedules a visit
      pm.test("Status is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has inquiry fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("propertyId");
        pm.expect(json).to.have.property("propertyTitle");
        pm.expect(json).to.have.property("buyerUsername");
        pm.expect(json).to.have.property("inquiryType");
        pm.expect(json).to.have.property("message");
        pm.expect(json).to.have.property("status");
        pm.expect(json).to.have.property("visitId");
        pm.expect(json).to.have.property("visitDetails");
        pm.expect(json).to.have.property("createdAt");
      });

      pm.test("inquiryType is VISIT_REQUEST", function () {
        pm.expect(pm.response.json().inquiryType).to.eql("VISIT_REQUEST");
      });

      pm.test("visitId is set (visit was created)", function () {
        pm.expect(pm.response.json().visitId).to.not.be.null;
      });

      // Save inquiryId for subsequent requests
      const id = pm.response.json().id;
      if (id) {
        pm.collectionVariables.set("inquiryId", String(id));
        console.log("inquiryId saved: " + id);
      }
