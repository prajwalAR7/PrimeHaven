$kind: http-request
name: 'Update Visit Status'
order: 4000
method: PATCH
url: '{{gatewayUrl}}/api/visits/{{visitId}}/status'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwt}}'
body:
  type: json
  content: |-
    {
      "status": "CONFIRMED"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // API TEST 13 — Update visit status
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Visit status updated", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
      });
