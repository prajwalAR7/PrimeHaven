$kind: http-request
name: 'Validate Token'
order: 4000
method: GET
url: '{{gatewayUrl}}/api/auth/validate'
headers:
  - key: Authorization
    value: 'Bearer {{jwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // API TEST 4 — Validate token
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has validation fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("valid");
        pm.expect(json).to.have.property("username");
        pm.expect(json).to.have.property("role");
        pm.expect(json).to.have.property("message");
      });

      pm.test("Token is valid", function () {
        pm.expect(pm.response.json().valid).to.be.true;
      });
