$kind: http-request
name: 'Get Availability'
order: 5000
method: GET
url: '{{gatewayUrl}}/api/properties/{{propertyId}}/availability'
headers:
  - key: Authorization
    value: 'Bearer {{jwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // API TEST 9 — Availability (internal API)
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has availability fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("propertyId");
        pm.expect(json).to.have.property("available");
        pm.expect(json).to.have.property("title");
        pm.expect(json).to.have.property("status");
        pm.expect(json).to.have.property("price");
      });

      pm.test("available is a boolean", function () {
        pm.expect(pm.response.json().available).to.be.a("boolean");
      });
