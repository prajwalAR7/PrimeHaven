$kind: http-request
name: 'Create Property'
order: 1000
method: POST
url: '{{gatewayUrl}}/api/properties'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwt}}'
body:
  type: json
  content: |-
    {
      "title": "Palm Grove Villa",
      "description": "Four-bedroom villa with a pool",
      "address": "42 Palm Grove Road",
      "city": "Bengaluru",
      "price": 12500000.00,
      "propertyType": "VILLA",
      "status": "AVAILABLE",
      "bedrooms": 4,
      "bathrooms": 3,
      "agentUsername": "agent_sarah"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // API TEST 5 — Create property
      pm.test("Status is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has property fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("title");
        pm.expect(json).to.have.property("description");
        pm.expect(json).to.have.property("address");
        pm.expect(json).to.have.property("city");
        pm.expect(json).to.have.property("price");
        pm.expect(json).to.have.property("propertyType");
        pm.expect(json).to.have.property("status");
        pm.expect(json).to.have.property("bedrooms");
        pm.expect(json).to.have.property("bathrooms");
        pm.expect(json).to.have.property("agentUsername");
        pm.expect(json).to.have.property("createdAt");
        pm.expect(json).to.have.property("updatedAt");
      });

      pm.test("Title matches", function () {
        pm.expect(pm.response.json().title).to.eql("Palm Grove Villa");
      });

      pm.test("Status is AVAILABLE", function () {
        pm.expect(pm.response.json().status).to.eql("AVAILABLE");
      });

      // Save propertyId for subsequent requests
      const id = pm.response.json().id;
      if (id) {
        pm.collectionVariables.set("propertyId", String(id));
        console.log("propertyId saved: " + id);
      }
